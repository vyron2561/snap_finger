name: Build and publish KOFAXA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KOFAXA_KEYSTORE_BASE64: ${{ secrets.KOFAXA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KOFAXA_KEYSTORE_BASE64:?Missing KOFAXA_KEYSTORE_BASE64 secret}"
          mkdir -p "$RUNNER_TEMP/kofaxa-signing"
          printf '%s' "$KOFAXA_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/kofaxa-signing/release.jks"
          test -s "$RUNNER_TEMP/kofaxa-signing/release.jks"
          echo "KOFAXA_KEYSTORE_FILE=$RUNNER_TEMP/kofaxa-signing/release.jks" \
            >> "$GITHUB_ENV"

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KOFAXA_KEYSTORE_PASSWORD: ${{ secrets.KOFAXA_KEYSTORE_PASSWORD }}
          KOFAXA_KEY_ALIAS: ${{ secrets.KOFAXA_KEY_ALIAS }}
          KOFAXA_KEY_PASSWORD: ${{ secrets.KOFAXA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Calculate APK checksum
        id: checksum
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "kofaxa-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOFAXA-${{ steps.version.outputs.name }}
          path: kofaxa-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: KOFAXA ${{ steps.version.outputs.name }}
          body: |
            Automated KOFAXA release.

            - Version: ${{ steps.version.outputs.name }}
            - Version code: ${{ steps.version.outputs.code }}
            - SHA256: `${{ steps.checksum.outputs.sha256 }}`
          files: kofaxa-${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
